[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fileguard"
version = "1.0.0"
description = "Intelligent Duplicate File Detection & Storage Manager"
readme = "README.md"
authors = [{ name = "Raguram Ram P", email = "raguramrrp@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0.0",
    "matplotlib>=3.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
